[project]
name = "react_agent"
version = "0.0.1"
description = "react_agent"
readme = "README.md"
license = "MIT"
authors = [{ name = "Gaius", email = "caio.gui.castro@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "langchain[ollama]>=1.2.6",
    "python-dotenv>=1.2.2",
    "rich>=14.2.0",
]

[project.optional-dependencies]

dev = ["ruff", "pyright", "pytest", "pytest-xdist"]

# ============================
# Lint e formatação (Ruff)
# ============================
[tool.ruff]
line-length = 88
target-version = "py313"
fix = true
show-fixes = true
indent-width = 4
exclude = ["venv", ".venv", "env", ".env", "node_modules", "__pycache__"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "T201",  # Checks for print statements.
    "INP001", # Checks for packages that are missing an __init__.py file.
    "D", # All pydocstyle (D)
    # Checks that function arguments are annotated with a more specific type 
    # than Any.
    "ANN401", 
    "ERA001", # Checks for commented-out Python code.
    "A004" # Shadowing Python Builtin.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["react_agent"]


# ============================
# Tipagem (Pyright)
# ============================
[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
include = ["src", 'tests']
exclude = [
    "**/.*",
    "**/venv",
    "**/.venv",
    "**/env",
    "**/.env",
    "**/node_modules",
    "**/__pycache__", 
]
venv = ".venv"
venvPath = "."
executionEnvironments = [{ root = "src" }]

# ============================
# Testes (Pytest)
# ============================
[tool.pytest.ini_options]
addopts = "-s --color=yes --tb=short"
pythonpath = ["src"]
testpaths = ["tests"]


# ============================
# Build e Setuptools
# ============================
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }
